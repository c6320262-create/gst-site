// Strict GST prompt with verified rates
const GST_PROMPT = (productName) => `You are a highly accurate Indian GST expert. For the product or service: "${productName}", provide complete GST classification under Indian GST law 2024-25.

Respond ONLY with this exact JSON, no markdown, no extra text:
{
  "supplyType": "Taxable or Exempt or Nil Rated or Zero Rated or Non GST",
  "applicable": true or false,
  "rate": 0 or 5 or 12 or 18 or 28,
  "detectedName": "product or service name",
  "category": "category name",
  "hsn": "HSN or SAC code",
  "type": "Goods or Services",
  "rcm": true or false,
  "rcmNote": "explain who pays GST under RCM if applicable, else empty string",
  "note": "2-3 sentences explaining GST status clearly",
  "exemptionReason": "explain why exempt or nil rated if applicable, else empty string",
  "alternateRates": "IMPORTANT: if product has different rates based on form/brand/value mention ALL variants clearly, else empty string",
  "clarification": "if product name is ambiguous mention what assumptions were made, else empty string"
}

SUPPLY TYPE DEFINITIONS:
- Taxable = GST charged at 5/12/18/28%
- Nil Rated = 0% GST, within GST scope, ITC not available
- Exempt = Outside GST, no tax, ITC not available
- Zero Rated = Exports/SEZ, 0% GST, ITC available
- Non GST = Completely outside GST (petrol, alcohol)

AGRICULTURAL PRODUCE RULES — VERY IMPORTANT:
Fresh/raw form = EXEMPT:
- Fresh vegetables (potato, onion, tomato, carrot, etc) = Exempt
- Fresh fruits (mango, banana, apple, etc) = Exempt
- Fresh turmeric, fresh ginger, fresh garlic = Exempt
- Fresh chilli, fresh coriander = Exempt
- Fresh coconut = Exempt
- Raw sugarcane = Exempt
- Raw cotton = Exempt
- Fresh flowers = Exempt
- Fresh meat, fresh fish, fresh eggs = Exempt

Dried/Processed/Packaged form = TAXABLE:
- Dry turmeric (whole or powder) = 5%
- Dry ginger powder = 5%
- Dry chilli, chilli powder = 5%
- Coriander powder, cumin powder = 5%
- All spice powders = 5%
- Coconut oil = 5%
- Desiccated coconut = 5%
- Processed/packaged vegetables = 5% or 12%
- Fruit pulp, fruit juice = 12%

BRANDED vs UNBRANDED RULES:
- Unbranded rice, wheat, flour, pulses = Exempt
- Branded rice, wheat, flour, pulses = 5%
- Unbranded atta, maida, besan = Exempt
- Branded atta, maida, besan = 5%
- Unbranded namkeen = 5%
- Branded namkeen, chips, snacks = 18%
- Unbranded paneer = Exempt
- Branded paneer = 5%
- Unbranded curd = Exempt
- Branded curd = 5%

COMPOSITION SCHEME:
- Manufacturers turnover < 1.5 crore = 1% GST
- Traders turnover < 1.5 crore = 1% GST
- Restaurants under composition = 5% GST

EXEMPT ITEMS:
- Fresh milk, lassi, buttermilk (unbranded) = Exempt
- Salt = Exempt
- Books, textbooks, newspapers = Exempt
- Educational services (schools/colleges) = Exempt
- Healthcare (hospitals/doctors/ambulance) = Exempt
- Public transport (auto, bus, metro, train) = Exempt
- Religious services = Exempt
- Electricity = Exempt
- Agriculture services = Exempt
- Renting residential property (by individual) = Exempt

NON GST ITEMS:
- Petrol, diesel, crude oil = Non GST
- Alcohol for human consumption = Non GST
- Natural gas (partially) = Non GST

VERIFIED GST RATES:
- Mobile phones = 12%
- Laptops/computers = 18%
- Tea/coffee (branded) = 5%
- Edible oils = 5%
- Sugar = 5%
- Medicines/drugs = 5%
- Pencils/pens = 12%
- Hair oil/shampoo/soap = 18%
- Gold/silver = 3%
- Restaurants = 5%
- AC/washing machine = 28%
- Cars = 28%
- Cement = 28%
- Cigarettes/tobacco = 28%
- IT/Banking/Insurance services = 18%
- Hotels (room tariff above 7500) = 18%
- Hotels (room tariff 2500-7500) = 12%
- Construction services = 5% or 12%
- Works contract = 18%

RCM SUPPLIES — rcm=true:
- Legal services by advocate = RCM (recipient pays)
- Goods Transport Agency (GTA) = RCM (recipient pays)
- Services by director to company = RCM
- Import of services = RCM
- Sponsorship services = RCM
- Insurance agent services = RCM
- Recovery agent services = RCM
- Security services = RCM
- Renting of motor vehicle = RCM (in some cases)

CRITICAL RULES:
- ALWAYS check if product is fresh/raw vs dried/processed vs branded/unbranded
- Fresh/raw agricultural produce = ALWAYS Exempt
- Dried/processed agricultural produce = TAXABLE at 5%
- Branded food = higher rate than unbranded
- rate MUST be exactly 0, 5, 12, 18 or 28
- In alternateRates field ALWAYS mention fresh vs processed difference for agricultural items
- In clarification field mention what form/type was assumed
- Give accurate HSN (goods) or SAC (services) code`;

async function callGemini(prompt, imageBase64, apiKey) {
  const parts = [];
  if(imageBase64) parts.push({inlineData:{mimeType:"image/jpeg",data:imageBase64}});
  parts.push({text:prompt});
  const res = await fetch(`https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash-latest:generateContent?key=${apiKey}`,{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({contents:[{parts}],generationConfig:{temperature:0.1}})
  });
  const data = await res.json();
  if(data.error) throw new Error(data.error.message);
  return data.candidates[0].content.parts[0].text;
}

async function callGroq(prompt, apiKey) {
  const res = await fetch("https://api.groq.com/openai/v1/chat/completions",{
    method:"POST",
    headers:{"Content-Type":"application/json","Authorization":`Bearer ${apiKey}`},
    body:JSON.stringify({model:"llama-3.3-70b-versatile",messages:[{role:"system",content:"You are an Indian GST expert. Always respond with valid JSON only. No markdown. No extra text."},{role:"user",content:prompt}],max_tokens:800,temperature:0.1})
  });
  const data = await res.json();
  if(data.error) throw new Error(data.error.message);
  return data.choices[0].message.content;
}

async function callOpenRouter(prompt, apiKey) {
  const res = await fetch("https://openrouter.ai/api/v1/chat/completions",{
    method:"POST",
    headers:{"Content-Type":"application/json","Authorization":`Bearer ${apiKey}`},
    body:JSON.stringify({model:"mistralai/mistral-7b-instruct:free",messages:[{role:"user",content:prompt}],max_tokens:800,temperature:0.1})
  });
  const data = await res.json();
  if(data.error) throw new Error(data.error.message||JSON.stringify(data.error));
  return data.choices[0].message.content;
}

async function callClaude(prompt, imageBase64, apiKey) {
  const userContent = imageBase64
    ?[{type:"image",source:{type:"base64",media_type:"image/jpeg",data:imageBase64}},{type:"text",text:prompt}]
    :prompt;
  const res = await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:800,messages:[{role:"user",content:userContent}]})
  });
  const data = await res.json();
  if(data.error) throw new Error(data.error.message);
  return data.content.map(i=>i.text||"").join("");
}

async function queryAI(prompt, imageBase64, provider, apiKey) {
  if(provider==="gemini") return callGemini(prompt,imageBase64,apiKey);
  if(provider==="groq") return callGroq(prompt,apiKey);
  if(provider==="openrouter") return callOpenRouter(prompt,apiKey);
  if(provider==="claude") return callClaude(prompt,imageBase64,apiKey);
  throw new Error("No provider selected");
}

function parseJSON(text) {
  const clean = text.replace(/```json|```/g,"").trim();
  const start = clean.indexOf("{");
  const end = clean.lastIndexOf("}");
  if(start === -1 || end === -1) throw new Error("Invalid response format");
  return JSON.parse(clean.slice(start, end+1));
}

// Lookup Tab
function LookupTab({onUseCalc,history,setHistory,provider,apiKey}) {
  const [query,setQuery]=useState("");
  const [loading,setLoading]=useState(false);
  const [info,setInfo]=useState(null);
  const [err,setErr]=useState("");

  const checkGST=async()=>{
    if(!apiKey){setErr("Please connect your API key first using the setup box above.");return;}
    if(!query.trim()) return;
    setLoading(true);setErr("");setInfo(null);
    const prompt=GST_PROMPT(query);
    try {
      const text=await queryAI(prompt,null,provider,apiKey);
      const parsed=parseJSON(text);
      if(![0,5,12,18,28].includes(parsed.rate)) throw new Error("Invalid rate returned. Please try again.");
      const result={...parsed,product:query};
      setInfo(result);
      setHistory(h=>[result,...h.filter(x=>x.product!==result.product)].slice(0,12));
    } catch(e){
      setErr("Could not fetch GST info: "+e.message+". Please try again.");
    }
    setLoading(false);
  };

  return (
    <>
      <div className="card">
        <div className="card-title">🔍 Search GST Rate by Product Name</div>
        <div style={{marginBottom:10,fontSize:13,color:"var(--text2)"}}>Type any product or service name. For accurate results be specific — e.g. <em>"fresh turmeric"</em> or <em>"turmeric powder"</em>, <em>"branded rice"</em> or <em>"unbranded rice"</em>.</div>
        <div className="row">
          <input className="inp" placeholder="e.g. Fresh turmeric, Branded rice, Legal services, GTA..." value={query} onChange={e=>setQuery(e.target.value)} onKeyDown={e=>e.key==="Enter"&&checkGST()}/>
          <button className="btn btn-gold" onClick={checkGST} disabled={loading||!query.trim()}>{loading?"...":"Check GST"}</button>
        </div>
        {loading&&<div className="loading"><div className="ld"/><div className="ld"/><div className="ld"/><span>Checking GST rates...</span></div>}
        {err&&<div className="err">⚠️ {err}</div>}
        {info&&!loading&&(()=>{
          const isApplicable=info.applicable&&info.rate>0;
          const isExempt=!info.applicable||(info.applicable&&info.rate===0);
          const resultCls=isApplicable?"yes":isExempt?"exempt":"no";
          const supplyColor={
            "Taxable":"var(--green)",
            "Exempt":"var(--text2)",
            "Nil Rated":"var(--blue)",
            "Zero Rated":"var(--gold)",
            "Non GST":"var(--red)"
          }[info.supplyType]||"var(--text2)";
          return (
          <div className={`result ${resultCls}`}>
            <div className="r-top">
              <div className="r-product">{info.product}</div>
              <span className={`r-status ${resultCls}`} style={{background:supplyColor}}>
                {info.supplyType||( isApplicable?"Taxable":"Exempt")}
              </span>
            </div>
            {isApplicable&&<><div className="rate-big">{info.rate}%</div><div style={{fontSize:13,color:"var(--text2)",fontWeight:500}}>{info.category}</div></>}
            {!isApplicable&&<div style={{fontSize:16,fontWeight:700,color:"var(--text2)",margin:"10px 0 4px"}}>No GST Applicable</div>}

            {/* Supply Type explanation box */}
            <div style={{background:"rgba(255,255,255,0.7)",borderRadius:10,padding:"10px 14px",marginTop:12,fontSize:13}}>
              <div style={{fontWeight:700,color:"var(--text)",marginBottom:4}}>Supply Classification</div>
              {info.supplyType==="Taxable"&&<div style={{color:"var(--green)"}}>✅ This is a <strong>Taxable Supply</strong> — GST is charged at {info.rate}%</div>}
              {info.supplyType==="Exempt"&&<div style={{color:"var(--text2)"}}>🚫 This is an <strong>Exempt Supply</strong> — No GST charged. ITC not available on inputs.</div>}
              {info.supplyType==="Nil Rated"&&<div style={{color:"var(--blue)"}}>⭕ This is a <strong>Nil Rated Supply</strong> — GST rate is 0%. Supply is within GST scope but no tax charged.</div>}
              {info.supplyType==="Zero Rated"&&<div style={{color:"var(--gold)"}}>🌐 This is a <strong>Zero Rated Supply</strong> — 0% GST. ITC available. Applies to exports and SEZ supplies.</div>}
              {info.supplyType==="Non GST"&&<div style={{color:"var(--red)"}}>❌ This is a <strong>Non GST Supply</strong> — Completely outside GST scope. Governed by other tax laws.</div>}
            </div>

            {/* RCM Box */}
            {info.rcm&&(
              <div style={{background:"#fff3e0",border:"1px solid #ffcc80",borderRadius:10,padding:"10px 14px",marginTop:8,fontSize:13}}>
                <div style={{fontWeight:700,color:"#e65100",marginBottom:4}}>⚠️ Reverse Charge Mechanism (RCM) Applies</div>
                <div style={{color:"#bf360c"}}>{info.rcmNote||"Under RCM, the recipient (buyer) is liable to pay GST directly to the government instead of the supplier."}</div>
              </div>
            )}

            <div className="info-grid">
              {info.hsn&&<div className="info-item"><div className="info-lbl">HSN / SAC Code</div><div className="info-val">{info.hsn}</div></div>}
              {info.category&&<div className="info-item"><div className="info-lbl">Category</div><div className="info-val">{info.category}</div></div>}

              {isApplicable&&<div className="info-item"><div className="info-lbl">CGST Rate</div><div className="info-val">{info.rate/2}%</div></div>}
              {isApplicable&&<div className="info-item"><div className="info-lbl">SGST Rate</div><div className="info-val">{info.rate/2}%</div></div>}
              {isApplicable&&<div className="info-item"><div className="info-lbl">IGST Rate</div><div className="info-val">{info.rate}%</div></div>}
            </div>
            {isApplicable&&(
              <div className="breakdown">
                <div className="bk-row"><span className="bk-hd">Intra-State Supply</span><span/></div>
                <div className="bk-row"><span>CGST</span><span style={{fontWeight:700}}>{info.rate/2}%</span></div>
                <div className="bk-row"><span>SGST / UTGST</span><span style={{fontWeight:700}}>{info.rate/2}%</span></div>
                <div className="bk-row" style={{marginTop:6}}><span className="bk-hd">Inter-State Supply</span><span/></div>
                <div className="bk-row"><span>IGST</span><span style={{fontWeight:700}}>{info.rate}%</span></div>
              </div>
            )}
            {info.note&&<div className="note-box">📋 {info.note}</div>}
            {info.clarification&&<div style={{marginTop:8,fontSize:13,background:"var(--blue-light)",border:"1px solid #bfdbfe",borderRadius:9,padding:"10px 14px",color:"var(--blue)",lineHeight:1.7}}>💡 <strong>Assumption:</strong> {info.clarification}</div>}
            {info.exemptionReason&&<div className="exempt-box">ℹ️ {info.exemptionReason}</div>}
            {info.alternateRates&&<div className="alt-box">⚡ <strong>Different rates may apply:</strong> {info.alternateRates}</div>}
            {isApplicable&&<button className="btn btn-gold btn-sm" style={{marginTop:14}} onClick={()=>onUseCalc(info.rate)}>Use {info.rate}% in Calculator →</button>}
          </div>
        );})()}
      </div>
      <LookupFAQ/>
    </>
  );
}

// Lookup Page FAQ
function LookupFAQ() {
  const [open,setOpen]=useState(null);
  const toggle=k=>setOpen(o=>o===k?null:k);
  const faqs=[
    {q:"What is GST?",a:"GST (Goods and Services Tax) is a single indirect tax levied on supply of goods and services across India. It replaced multiple old taxes like VAT, Service Tax, Excise Duty, etc. Introduced on 1st July 2017 under the motto 'One Nation One Tax', GST is collected at every stage of the supply chain but the final burden falls only on the end consumer."},
    {q:"What are the GST slabs in India?",a:<div><p style={{marginBottom:8}}>India has 5 GST rate slabs:</p><table className="slab-table"><thead><tr><th>Rate</th><th>Products / Services</th></tr></thead><tbody><tr><td style={{fontWeight:700}}>0%</td><td>Essential items — milk, eggs, fresh vegetables, books, grains</td></tr><tr><td style={{fontWeight:700}}>5%</td><td>Common items — edible oil, sugar, tea, coffee, medicines</td></tr><tr><td style={{fontWeight:700}}>12%</td><td>Mobile phones, computers, processed food, pencils</td></tr><tr><td style={{fontWeight:700}}>18%</td><td>Most services, electronics, soaps, hair oil, laptop</td></tr><tr><td style={{fontWeight:700}}>28%</td><td>Luxury — cars, tobacco, cement, AC, washing machine</td></tr></tbody></table></div>},
    {q:"What is the difference between CGST, SGST and IGST?",a:"CGST (Central GST) is collected by the Central Government. SGST (State GST) is collected by the State Government. Both CGST and SGST are charged for transactions within the same state (Intra-State). IGST (Integrated GST) is charged for transactions between two different states (Inter-State). For example: Product worth ₹1000 with 18% GST sold within Maharashtra → CGST 9% = ₹90 + SGST 9% = ₹90. Sold across states → IGST 18% = ₹180."},
    {q:"What is HSN Code?",a:"HSN stands for Harmonised System of Nomenclature. It is a 6-8 digit code used to classify goods under GST. Every product has a unique HSN code that determines its GST rate. For example: Mobile phones = HSN 8517 (12% GST), Tea = HSN 0902 (5% GST), Books = HSN 4901 (0% / Exempt)."},
    {q:"What is SAC Code?",a:"SAC stands for Services Accounting Code. It is similar to HSN code but used for services instead of goods. Every service has a unique SAC code. For example: Restaurant services = SAC 9963 (5% GST), Hotel accommodation = SAC 9963 (varies), IT software services = SAC 9983 (18% GST)."},
    {q:"Which products are exempt from GST?",a:"Many essential items are fully exempt: Fresh fruits and vegetables, Milk and curd, Eggs, Unbranded flour and rice, Fresh meat and fish, Books and newspapers, Educational services, Healthcare services by hospitals, Bangles, Handloom products. These items have 0% GST or are completely outside GST scope."},
    {q:"What is GST on mobile phones?",a:"Mobile phones attract 12% GST in India (HSN 8517). Mobile accessories like chargers, earphones, cases attract 18% GST. Mobile repair services attract 18% GST."},
    {q:"What is GST on gold and jewellery?",a:"Gold attracts 3% GST (HSN 7108). Making charges on gold jewellery attract 5% GST separately. Silver also attracts 3% GST. Diamond and precious stones attract 0.25% GST."},
    {q:"What is GST on medicines?",a:"Most medicines attract 5% GST. Life-saving drugs attract 5%. Some medicines are at 12%. Ayurvedic medicines attract 12%. Hospital services are fully exempt (0%). Medical devices like syringes attract 12% GST."},
    {q:"Who needs to register for GST?",a:"Any business with annual turnover above ₹40 lakhs (goods) or ₹20 lakhs (services) must register for GST. E-commerce sellers must register regardless of turnover. Businesses doing inter-state supply must also register. Special category states have lower limits of ₹20 lakhs for goods."},
    {q:"What is Input Tax Credit (ITC)?",a:"Input Tax Credit means you can reduce the GST you paid on purchases from the GST you collect on sales. Example: You paid ₹180 GST on raw material. You collected ₹360 GST on finished product. You pay only ₹360 - ₹180 = ₹180 to the government. This avoids double taxation and is one of the biggest benefits of GST."},
    {q:"What is Reverse Charge Mechanism in GST?",a:"Normally the seller pays GST. Under Reverse Charge Mechanism (RCM), the buyer pays GST directly to the government. RCM applies when buying from unregistered dealers, importing services, or for specific categories like legal services and transport (GTA)."},
  ];
  return (
    <div style={{marginTop:8}}>
      <div className="faq-heading">
        <div className="faq-heading-title">❓ Frequently Asked Questions</div>
        <div className="faq-heading-sub">Everything you need to know about GST in India</div>
      </div>
      <div className="card" style={{paddingTop:18}}>
        {faqs.map((f,i)=>(
          <div key={i} className="faq-item">
            <button className="faq-q" onClick={()=>toggle(i)}>
              <span>{f.q}</span>
              <span className={`faq-arrow${open===i?" open":""}`}>▼</span>
            </button>
            {open===i&&<div className="faq-a"><div className="faq-a-inner">{f.a}</div></div>}
          </div>
        ))}
      </div>
    </div>
  );
}

                    <tr><td colSpan="3"/><td style={{fontSize:11,color:"var(--text2)"}}>SGST @ {r/2}%</td><td style={{textAlign:"right",fontSize:11}}>₹{fmt(half)}</td></tr>
                  </>:<tr><td colSpan="3"/><td style={{fontSize:11,color:"var(--text2)"}}>IGST @ {r}%</td><td style={{textAlign:"right",fontSize:11}}>₹{fmt(gstAmt)}</td></tr>}
                  <tr className="tr"><td colSpan="3"/><td style={{fontWeight:700}}>Grand Total</td><td style={{textAlign:"right",fontWeight:700,color:"var(--green)"}}>₹{fmt(total)}</td></tr>
                </tfoot>
              </table>
              <div className="inv-footer">Computer generated · For reference only · Verify with a CA before filing returns</div>
            </div>}
          </div>
        </>}
      </div>
      <CalcFAQ/>
    </>
  );
}

// Calculator Page FAQ
function CalcFAQ() {
  const [open,setOpen]=useState(null);
  const toggle=k=>setOpen(o=>o===k?null:k);
  const faqs=[
    {q:"What is 'Add GST to Amount' mode?",a:'This mode is used when you have a base price and want to calculate the final price after adding GST. Example: A product costs ₹1,000 (base price, before GST). With 18% GST → GST Amount = ₹1,000 × 18 ÷ 100 = ₹180. Total price you pay = ₹1,000 + ₹180 = ₹1,180. Use this when the price shown does NOT include GST.'},
    {q:"What is 'Extract GST from Amount' mode?",a:'This mode is used when you already have a final price that includes GST, and you want to find out how much GST is inside it. Example: You paid ₹1,180 total (GST already included). With 18% GST → Base price = ₹1,180 × 100 ÷ 118 = ₹1,000. GST inside = ₹1,180 - ₹1,000 = ₹180. Use this when the price shown already includes GST.'},
    {q:"Why is the GST amount different in both modes?",a:"The GST amount differs because the base price is different in both modes. In Add GST mode, 18% is calculated on ₹1,000 = ₹180. In Extract GST mode, the same ₹1,180 total contains 18% GST on a smaller base (₹1,000), so GST = ₹180. The maths is correct in both cases — it is just answering a different question each time."},
    {q:"What is the difference between Intra-State and Inter-State GST?",a:"Intra-State means both buyer and seller are in the same state. GST is split equally between CGST (Central) and SGST (State). Inter-State means buyer and seller are in different states. Only IGST (Integrated GST) is charged, which goes entirely to the Central Government and is later shared with the destination state."},
    {q:"How to calculate CGST and SGST?",a:"For Intra-State transactions, total GST is split 50/50 between CGST and SGST. Formula: CGST = Total GST ÷ 2. SGST = Total GST ÷ 2. Example: Product ₹1,000 with 18% GST → Total GST = ₹180. CGST = ₹90 (9%), SGST = ₹90 (9%). Both amounts are shown separately on the invoice."},
    {q:"What is a Tax Invoice?",a:"A Tax Invoice is an official document issued by a GST-registered business for taxable supply of goods or services. It must include: Seller's GSTIN, Invoice number and date, Buyer's details, HSN/SAC code, Taxable value, GST rate and amount (CGST, SGST or IGST), Total amount. Our invoice generator creates a reference invoice — get it verified by a CA for official use."},
    {q:"What are GST return types?",a:"Major GST returns are: GSTR-1 — Details of outward supplies (monthly or quarterly). GSTR-3B — Monthly summary return with tax payment. GSTR-9 — Annual return (once a year). GSTR-2B — Auto-drafted input tax credit statement. Late filing fee is ₹50 per day (₹20 for nil returns)."},
  ];
  return (
    <div style={{marginTop:8}}>
      <div className="faq-heading">
        <div className="faq-heading-title">❓ Calculator FAQs</div>
        <div className="faq-heading-sub">How to use the GST Calculator correctly</div>
      </div>
      <div className="card" style={{paddingTop:18}}>
        {faqs.map((f,i)=>(
          <div key={i} className="faq-item">
            <button className="faq-q" onClick={()=>toggle(i)}>
              <span>{f.q}</span>
              <span className={`faq-arrow${open===i?" open":""}`}>▼</span>
            </button>
            {open===i&&<div className="faq-a"><div className="faq-a-inner">{f.a}</div></div>}
          </div>
        ))}
      </div>
    </div>
  );
}

// History Tab
function HistoryTab({history,onClear}) {
  if(!history.length) return (
    <div className="card"><div className="card-title">🕐 Recent Lookups</div>
      <div style={{textAlign:"center",padding:"36px 0",color:"var(--text3)"}}>
        <div style={{fontSize:28,marginBottom:8}}>🔍</div>
        <div style={{fontSize:14}}>No lookups yet. Search for a product first!</div>
      </div>
    </div>
  );
  return (
    <div className="card"><div className="card-title">🕐 Recent Lookups ({history.length})</div>
      {history.map((h,i)=>(
        <div key={i} className="hist-item">
          <div className={`hist-badge${!h.applicable?" ex":""}`}>{h.applicable?`${h.rate}%`:"Exempt"}</div>
          <div style={{flex:1}}>
            <div style={{fontWeight:600,fontSize:14}}>{h.product}</div>
            <div style={{fontSize:11,color:"var(--text3)",marginTop:1}}>{h.category}{h.hsn?` · HSN: ${h.hsn}`:""}</div>
          </div>
        </div>
      ))}
      <button className="btn btn-outline btn-sm" style={{marginTop:13}} onClick={onClear}>Clear History</button>
    </div>
  );
}

// Feedback Tab
function FeedbackTab() {
  const [feedbacks,setFeedbacks]=useState(INIT_FBS);
  const [rating,setRating]=useState(0);const [hover,setHover]=useState(0);
  const [category,setCategory]=useState("");const [name,setName]=useState("");
  const [msg,setMsg]=useState("");const [submitted,setSubmitted]=useState(false);
  const avg=feedbacks.length?(feedbacks.reduce((s,f)=>s+f.rating,0)/feedbacks.length).toFixed(1):"—";
  const starCounts=[5,4,3,2,1].map(s=>({s,count:feedbacks.filter(f=>f.rating===s).length}));
  const submit=()=>{
    if(!rating) return;
    setFeedbacks(prev=>[{name:name.trim()||"Anonymous",rating,category:category||"General",msg:msg.trim()||"No message.",time:"Just now"},...prev]);
    setSubmitted(true);
  };
  const reset=()=>{setRating(0);setHover(0);setCategory("");setName("");setMsg("");setSubmitted(false);};
  return (
    <>
      <div className="card"><div className="card-title">📊 Overall Rating</div>
        <div className="rating-summary">
          <div><div className="rating-big">{avg}</div><div className="rating-sub">/ 5 · {feedbacks.length} reviews</div></div>
          <div style={{flex:1}}>
            {starCounts.map(({s,count})=>(
              <div className="bar-row" key={s}>
                <span className="bar-lbl">{s}</span>
                <div className="bar-track"><div className="bar-fill" style={{width:feedbacks.length?`${count/feedbacks.length*100}%`:"0%"}}/></div>
                <span className="bar-cnt">{count}</span>
              </div>
            ))}
          </div>
        </div>
      </div>
      <div className="card"><div className="card-title">✍️ Leave Your Feedback</div>
        {submitted?(
          <div className="ok-box">
            <div style={{fontSize:32,marginBottom:8}}>🎉</div>
            <div style={{fontWeight:700,color:"var(--green)",fontSize:16}}>Thank you for your feedback!</div>
            <div style={{fontSize:13,color:"var(--text2)",marginTop:4}}>Your review helps us improve.</div>
            <button className="btn btn-outline btn-sm" style={{marginTop:13}} onClick={reset}>Write Another Review</button>
          </div>
        ):(
          <>
            <div className="field-lbl">Your Rating *</div>
            <div className="stars-row">
              {[1,2,3,4,5].map(s=>(
                <span key={s} className={`star${(hover||rating)>=s?" lit":""}`}
                  onMouseEnter={()=>setHover(s)} onMouseLeave={()=>setHover(0)} onClick={()=>setRating(s)}>⭐</span>
              ))}
              {rating>0&&<span style={{fontSize:13,color:"var(--text2)",marginLeft:4}}>{["","Poor","Fair","Good","Great","Excellent!"][rating]}</span>}
            </div>
            <div className="field-lbl">Category</div>
            <div className="fb-cats">
              {["Accuracy","Calculator","UI / Design","Photo Feature","Speed","Suggestions"].map(c=>(
                <button key={c} className={`fb-cat${category===c?" on":""}`} onClick={()=>setCategory(c)}>{c}</button>
              ))}
            </div>
            <div className="field-lbl">Your Name (optional)</div>
            <input className="inp" placeholder="e.g. Rahul M." value={name} onChange={e=>setName(e.target.value)} style={{marginBottom:12}}/>
            <div className="field-lbl">Your Message (optional)</div>
            <textarea className="textarea" placeholder="What works well? What can be improved?" value={msg} onChange={e=>setMsg(e.target.value)} style={{marginBottom:14}}/>
            <button className="btn btn-gold" onClick={submit} disabled={!rating}>Submit Feedback ✓</button>
            {!rating&&<div style={{fontSize:12,color:"var(--text3)",marginTop:7}}>Please select a star rating first.</div>}
          </>
        )}
      </div>
      <div className="card"><div className="card-title">💬 All Reviews ({feedbacks.length})</div>
        {feedbacks.map((f,i)=>(
          <div key={i} className="fb-card">
            <div className="fb-card-top"><span className="fb-card-stars">{"⭐".repeat(f.rating)}</span><span className="fb-card-meta">{f.name} · {f.time}</span></div>
            <div className="fb-card-cat">{f.category}</div>
            <div className="fb-card-msg">{f.msg}</div>
          </div>
        ))}
      </div>
    </>
  );
}

// Main App
function App() {
  const [tab,setTab]=useState("lookup");
  const [calcRate,setCalcRate]=useState(18);
  const [history,setHistory]=useState([]);
  const [provider,setProvider]=useState(()=>localStorage.getItem("gst_provider")||"groq");
  const [apiKey,setApiKey]=useState(()=>localStorage.getItem("gst_api_key")||"");
  const handleSetProvider=p=>{setProvider(p);setApiKey("");localStorage.removeItem("gst_api_key");};
  return (
    <div className="app">
      <div className="wrap">
        <div className="hdr">
          <div className="hdr-badge">🇮🇳 India · GST Portal</div>
          <div className="logo"><div className="logo-text">GST</div><div className="logo-sub">₹</div></div>
          <h1>GST <em>Calculator</em> Pro</h1>
          <p>Search any product · Full GST breakdown · Invoice generator · 100% Free</p>
        </div>
        <ApiSetup provider={provider} setProvider={handleSetProvider} apiKey={apiKey} setApiKey={setApiKey}/>
        <div className="tabs">
          {[["lookup","🔍 Lookup"],["calc","🧮 Calculator"],["history","🕐 History"],["feedback","💬 Feedback"]].map(([k,v])=>(
            <button key={k} className={`tab${tab===k?" on":""}`} onClick={()=>setTab(k)}>{v}</button>
          ))}
        </div>
        {tab==="lookup"&&<LookupTab onUseCalc={r=>{setCalcRate(r);setTab("calc");}} history={history} setHistory={setHistory} provider={provider} apiKey={apiKey}/>}
        {tab==="calc"&&<CalcTab initRate={calcRate}/>}
        {tab==="history"&&<HistoryTab history={history} onClear={()=>setHistory([])}/>}
        {tab==="feedback"&&<FeedbackTab/>}
        <div className="footer-note">© 2025 GST Calculator Pro · India · For reference only · Always verify with a Chartered Accountant</div>
      </div>
    </div>
  );
}
ReactDOM.render(<App/>, document.getElementById("root"));
</script>
</body>
</html>
