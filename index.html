  {
    section:"📘 Basic GST Questions",
    items:[
      {q:"What is GST?",a:"GST stands for Goods and Services Tax. It is a single indirect tax levied on the supply of goods and services across India. GST replaced multiple taxes like VAT, Service Tax, Excise Duty and others. It was introduced on 1st July 2017 under the slogan 'One Nation One Tax'. GST is collected at every stage of the supply chain but the final burden falls only on the end consumer."},
      {q:"When was GST introduced in India?",a:"GST was introduced in India on 1st July 2017. It was passed in the Parliament as the 101st Constitutional Amendment Act. GST Council was formed to decide GST rates and policies. It is considered the biggest tax reform in India since Independence."},
      {q:"What are the GST slabs in India?",a:<>India has 5 GST rate slabs:<table className='slab-table'><thead><tr><th>GST Rate</th><th>Products / Services</th></tr></thead><tbody><tr><td>0%</td><td>Essential items — milk, eggs, fresh vegetables, grains</td></tr><tr><td>5%</td><td>Common use items — edible oil, sugar, tea, coffee, medicines</td></tr><tr><td>12%</td><td>Computers, processed food, mobile phones (older)</td></tr><tr><td>18%</td><td>Most services, electronics, soaps, hair oil</td></tr><tr><td>28%</td><td>Luxury items — cars, tobacco, cement, washing machines</td></tr></tbody></table></>},
      {q:"What is the difference between CGST, SGST and IGST?",a:"CGST (Central GST) is collected by the Central Government. SGST (State GST) is collected by the State Government. Both CGST and SGST are charged for transactions within the same state (Intra-State). IGST (Integrated GST) is charged for transactions between two different states (Inter-State) and is collected by the Central Government. For example: If you buy a product worth ₹1000 with 18% GST within Maharashtra — CGST 9% = ₹90 + SGST 9% = ₹90. If you buy across states — IGST 18% = ₹180."},
      {q:"Who needs to register for GST?",a:"Any business with annual turnover above ₹40 lakhs (for goods) or ₹20 lakhs (for services) must register for GST. In some special category states this limit is ₹20 lakhs for goods and ₹10 lakhs for services. E-commerce sellers must register regardless of turnover. Businesses doing inter-state supply must also register."},
      {q:"What is the GST registration turnover limit?",a:"The GST registration limit is ₹40 lakhs per year for businesses selling goods. For service providers the limit is ₹20 lakhs per year. For special category states like Manipur, Mizoram, Nagaland, Tripura the limit is ₹20 lakhs for goods and ₹10 lakhs for services. Businesses below this limit can also voluntarily register for GST."},

      {q:"What is HSN Code?",a:"HSN stands for Harmonised System of Nomenclature. It is a 6-8 digit code used to classify goods under GST. Every product has a unique HSN code. HSN codes help in identifying the correct GST rate for a product. Businesses with turnover above ₹5 crores must mention 6-digit HSN code on invoices. Smaller businesses can use 4-digit HSN codes."},
      {q:"What is SAC Code?",a:"SAC stands for Services Accounting Code. It is similar to HSN code but used for services instead of goods. Every service has a unique SAC code under GST. For example: SAC 9963 is for accommodation services like hotels. SAC 9954 is for construction services. SAC codes help in finding the correct GST rate for services."},

    items:[
      {q:"How to calculate GST?",a:"There are two ways to calculate GST: (1) Adding GST to base price — GST Amount = Base Price × GST Rate ÷ 100. Total Price = Base Price + GST Amount. Example: Product costs ₹1000, GST 18% → GST = ₹180, Total = ₹1180. (2) Extracting GST from total price — Base Price = Total Price × 100 ÷ (100 + GST Rate). GST Amount = Total Price - Base Price. Example: Total price ₹1180, GST 18% → Base = ₹1000, GST = ₹180."},
      {q:"What is the difference between GST inclusive and GST exclusive?",a:"GST Exclusive means the price shown does not include GST. GST is added on top of the price. Example: Product MRP ₹1000 + 18% GST = ₹1180 total. GST Inclusive means the price already includes GST. You need to extract GST from the total. Example: Total ₹1180 already has 18% GST inside it. Base price = ₹1000, GST = ₹180."},
      {q:"How to calculate CGST and SGST separately?",a:"For Intra-State transactions, total GST is split equally between CGST and SGST. Formula: CGST = Total GST ÷ 2. SGST = Total GST ÷ 2. Example: Product ₹1000 with 18% GST → Total GST = ₹180. CGST = ₹90 (9%), SGST = ₹90 (9%). Both go on the invoice separately."},

    section:"📦 Product GST FAQs",
    items:[
      {q:"Which products are exempt from GST?",a:"Many essential items are fully exempt from GST: Fresh fruits and vegetables, Milk and curd, Eggs, Unbranded flour, rice and pulses, Fresh meat and fish, Books and newspapers, Bangles, Handloom products, Services by religious institutions. These items have 0% GST or are outside GST scope completely."},
      {q:"What is GST on mobile phones?",a:"Mobile phones attract 12% GST in India. This was revised from 18% to 12% by the GST Council. HSN code for mobile phones is 8517. Mobile phone accessories like chargers, earphones, covers attract 18% GST. Mobile phone repair services attract 18% GST."},
      {q:"What is GST on gold and jewellery?",a:"Gold attracts 3% GST in India. Making charges on gold jewellery attract 5% GST separately. So if you buy gold jewellery — 3% GST on gold value + 5% GST on making charges. HSN code for gold is 7108. Silver also attracts 3% GST. Diamond and precious stones attract 0.25% GST."},
      {q:"What is GST on food items?",a:"GST on food varies: Fresh and unprocessed food — 0% GST. Branded packaged food — 5% GST. Restaurants without AC — 5% GST. Restaurants with AC — 5% GST. Hotels with room tariff above ₹7500 — 18% GST on food. Ice cream parlours — 18% GST. Sweets from sweet shops — 5% GST."},
      {q:"What is GST on medicines?",a:"Most medicines attract 5% GST in India. Life saving drugs attract 5% GST. Some medicines are at 12% GST. Ayurvedic medicines attract 12% GST. Hospital services are exempt from GST — 0%. Medical devices like syringes attract 12% GST. Ambulance services are exempt from GST."},
      {q:"What is GST on petrol and diesel?",a:"Petrol and Diesel are currently outside the GST framework in India. They are taxed under the older system of Central Excise Duty and State VAT. The GST Council has not yet brought petroleum products under GST. This is a major pending reform. Only Aviation Turbine Fuel (ATF) and Natural Gas inclusion is being discussed."},
      {q:"What is GST on real estate?",a:"Under-construction properties attract 5% GST. Affordable housing (below ₹45 lakhs) attracts 1% GST. Completed ready-to-move properties with occupancy certificate — 0% GST. Land purchase — No GST. Commercial properties under construction — 12% GST. Renting residential property — Exempt from GST for individual landlords."},
      {q:"What is GST on insurance?",a:"Life insurance premiums attract 18% GST. Health insurance premiums attract 18% GST. Term insurance premiums attract 18% GST. There has been discussion about reducing GST on health and life insurance to make it more affordable, but as of 2025 it remains at 18%."},
    ]
  },
  {
    section:"📋 GST Filing & Compliance",
    items:[
      {q:"What are GST return types?",a:"Major GST returns are: GSTR-1 — Details of outward supplies, filed monthly or quarterly. GSTR-3B — Monthly summary return with tax payment. GSTR-9 — Annual return filed once a year. GSTR-2B — Auto-drafted input tax credit statement. Composition dealers file GSTR-4 quarterly. Non-filers face late fees of ₹50 per day (₹20 for nil returns)."},
      {q:"What is Input Tax Credit (ITC)?",a:"Input Tax Credit means you can reduce the GST you paid on purchases from the GST you collect on sales. Example: You bought raw material paying ₹180 GST. You sold finished product collecting ₹360 GST. You pay only ₹360 - ₹180 = ₹180 GST to government. This avoids double taxation and is one of the key benefits of GST."},
      {q:"What is Reverse Charge Mechanism in GST?",a:"Normally the seller pays GST to the government. Under Reverse Charge Mechanism (RCM), the buyer is responsible to pay GST directly to the government. RCM applies in cases like: Buying from unregistered dealers above ₹5000 per day, Import of services, Specific categories like legal services, transport services (GTA), etc."},
    ]
  },
];

async function callGemini(prompt, imageBase64, apiKey) {
  const parts = [];
  if(imageBase64) parts.push({inlineData:{mimeType:"image/jpeg",data:imageBase64}});
  parts.push({text:prompt});
  const res = await fetch(`https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash-latest:generateContent?key=${apiKey}`,{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({contents:[{parts}]})
  });
  const data = await res.json();
  if(data.error) throw new Error(data.error.message);
  return data.candidates[0].content.parts[0].text;
}

async function callGroq(prompt, apiKey) {
  const res = await fetch("https://api.groq.com/openai/v1/chat/completions",{
    method:"POST",
    headers:{"Content-Type":"application/json","Authorization":`Bearer ${apiKey}`},
    body:JSON.stringify({model:"llama-3.3-70b-versatile",messages:[{role:"user",content:prompt}],max_tokens:1000})
  });
  const data = await res.json();
  if(data.error) throw new Error(data.error.message);
  return data.choices[0].message.content;
}

async function callOpenRouter(prompt, apiKey) {
  const res = await fetch("https://openrouter.ai/api/v1/chat/completions",{
    method:"POST",
    headers:{"Content-Type":"application/json","Authorization":`Bearer ${apiKey}`},
    body:JSON.stringify({model:"mistralai/mistral-7b-instruct:free",messages:[{role:"user",content:prompt}],max_tokens:1000})
  });
  const data = await res.json();
  if(data.error) throw new Error(data.error.message||JSON.stringify(data.error));
  return data.choices[0].message.content;
}

async function callClaude(prompt, imageBase64, apiKey) {
  const userContent = imageBase64
    ?[{type:"image",source:{type:"base64",media_type:"image/jpeg",data:imageBase64}},{type:"text",text:prompt}]
    :prompt;
  const res = await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,messages:[{role:"user",content:userContent}]})
  });
  const data = await res.json();
  if(data.error) throw new Error(data.error.message);
  return data.content.map(i=>i.text||"").join("");
}

async function queryAI(prompt, imageBase64, provider, apiKey) {
  if(provider==="gemini") return callGemini(prompt,imageBase64,apiKey);
  if(provider==="groq") return callGroq(prompt,apiKey);
  if(provider==="openrouter") return callOpenRouter(prompt,apiKey);
  if(provider==="claude") return callClaude(prompt,imageBase64,apiKey);
  throw new Error("No provider selected");
}

  const [loading,setLoading]=useState(false);
  const [info,setInfo]=useState(null);
  const [err,setErr]=useState("");
  const loadFile=file=>{
    if(!file) return;
    const reader=new FileReader();
    reader.onload=e=>{setImgSrc(e.target.result);setImg64(e.target.result.split(",")[1]);setInfo(null);setErr("");};
    reader.readAsDataURL(file);
  };
  const checkGST=async()=>{
    if(!apiKey){setErr("Please connect your API key first.");return;}
    if(!query.trim()&&!img64) return;
    setLoading(true);setErr("");setInfo(null);
    const prompt=`You are an Indian GST expert. ${img64&&provider==="gemini"?"Identify the product in the image and then provide":`For the product "${query}", provide`} detailed GST information under Indian GST law 2024-25.
Respond ONLY with valid JSON no markdown no backticks:
{"applicable":true,"rate":18,"detectedName":"product name","category":"category name","hsn":"HSN code","type":"Goods or Services","note":"Write 3 to 4 lines: 1) Why this GST rate applies 2) Which GST council notification covers this 3) Any special conditions or exemptions 4) Any recent changes in rate","exemptionReason":"If exempt explain why in 2 lines else empty string","alternateRates":"If product has different rates for different variants explain clearly else empty string"}
Rules: applicable=true even for 0% zero-rated. false only if completely exempt. rate must be exactly 0,5,12,18 or 28. Give accurate HSN code.`;
    try {
      const text=await queryAI(prompt,(provider==="gemini"?img64:null),provider,apiKey);
      const parsed=JSON.parse(text.replace(/```json|```/g,"").trim());
      const result={...parsed,product:img64&&provider==="gemini"?(parsed.detectedName||"Identified Product"):query};
      setInfo(result);
      setHistory(h=>[result,...h.filter(x=>x.product!==result.product)].slice(0,12));
    } catch(e){setErr("Error: "+e.message);}
    setLoading(false);
  };
  const clearImg=()=>{setImg64(null);setImgSrc(null);setInfo(null);};
  const isYes=info&&info.applicable&&info.rate>0;

    <div className="card">
      <div className="card-title">📦 Search by Name or Photo</div>
      {imgSrc?(
        <div className="preview-wrap">

        <>
          <div className="photo-options">

            <div className="photo-btn"><span className="ico">🖼️</span><span>Choose Photo</span><input type="file" accept="image/*" onChange={e=>loadFile(e.target.files[0])}/></div>

        </>
      )}
      <div style={{textAlign:"center",color:"var(--text3)",fontSize:12,marginBottom:10}}>— or type the product name —</div>
      <div className="row">
        <input className="inp" placeholder="e.g. Mobile phone, Rice, Gold jewellery..." value={query} onChange={e=>setQuery(e.target.value)} onKeyDown={e=>e.key==="Enter"&&checkGST()}/>
        <button className="btn btn-gold" onClick={checkGST} disabled={loading||(!query.trim()&&!img64)}>{loading?"...":"Check GST"}</button>
      </div>
      {loading&&<div className="loading"><div className="ld"/><div className="ld"/><div className="ld"/><span>Checking GST rates...</span></div>}
      {err&&<div className="err">⚠️ {err}</div>}
      {info&&!loading&&(
        <div className={`result ${cls}`}>
          <div className="r-top"><div className="r-product">{info.product}</div>
            <span className={`r-status ${cls}`}>{isYes?"GST Applicable":info.rate===0&&info.applicable?"Zero Rated":"Exempt"}</span>
          </div>
          {isYes&&<><div className="rate-big">{info.rate}%</div><div style={{fontSize:13,color:"var(--text2)"}}>{info.category}</div></>}
          <div className="info-grid">
            {info.hsn&&<div className="info-item"><div className="info-lbl">HSN/SAC Code</div><div className="info-val">{info.hsn}</div></div>}
            {info.category&&<div className="info-item"><div className="info-lbl">Category</div><div className="info-val">{info.category}</div></div>}
            {info.type&&<div className="info-item"><div className="info-lbl">Supply Type</div><div className="info-val">{info.type}</div></div>}
            {isYes&&<div className="info-item"><div className="info-lbl">CGST Rate</div><div className="info-val">{info.rate/2}%</div></div>}
            {isYes&&<div className="info-item"><div className="info-lbl">SGST Rate</div><div className="info-val">{info.rate/2}%</div></div>}

function CalcTab({initRate}) {

  const half=gstAmt/2;
  const invNo="GST-"+Date.now().toString().slice(-6);

            <div style={{fontSize:13,color:"var(--text2)",marginTop:4}}>Your review helps us improve.</div>
            <button className="btn btn-outline btn-sm" style={{marginTop:13}} onClick={reset}>Write Another</button>
          </div>
        ):(
          <>
            <div className="field-lbl">Your Rating *</div>
            <div className="stars-row">
              {[1,2,3,4,5].map(s=>(
                <span key={s} className={`star${(hover||rating)>=s?" lit":""}`}
                  onMouseEnter={()=>setHover(s)} onMouseLeave={()=>setHover(0)} onClick={()=>setRating(s)}>⭐</span>
              ))}
              {rating>0&&<span style={{fontSize:13,color:"var(--text2)",marginLeft:4}}>{["","Poor","Fair","Good","Great","Excellent!"][rating]}</span>}
            </div>
            <div className="field-lbl">Category</div>
            <div className="fb-cats">
              {["Accuracy","Calculator","UI / Design","Photo Feature","Speed","Suggestions"].map(c=>(
                <button key={c} className={`fb-cat${category===c?" on":""}`} onClick={()=>setCategory(c)}>{c}</button>
              ))}
            </div>
            <div className="field-lbl">Your Name (optional)</div>
            <input className="inp" placeholder="e.g. Rahul M." value={name} onChange={e=>setName(e.target.value)} style={{marginBottom:12}}/>
            <div className="field-lbl">Your Message (optional)</div>
            <textarea className="textarea" placeholder="What works well? What can be improved?" value={msg} onChange={e=>setMsg(e.target.value)} style={{marginBottom:14}}/>
            <button className="btn btn-gold" onClick={submit} disabled={!rating}>Submit Feedback ✓</button>
            {!rating&&<div style={{fontSize:12,color:"var(--text3)",marginTop:7}}>Please select a star rating first.</div>}
          </>
        )}
      </div>
      <div className="card"><div className="card-title">💬 All Reviews ({feedbacks.length})</div>
        {feedbacks.map((f,i)=>(
          <div key={i} className="fb-card">
            <div className="fb-card-top"><span className="fb-card-stars">{"⭐".repeat(f.rating)}</span><span className="fb-card-meta">{f.name} · {f.time}</span></div>
            <div className="fb-card-cat">{f.category}</div>
            <div className="fb-card-msg">{f.msg}</div>
          </div>
        ))}
      </div>
    </>
  );
}

function App() {
  const [tab,setTab]=useState("lookup");
  const [calcRate,setCalcRate]=useState(18);
  const [history,setHistory]=useState([]);
  const [provider,setProvider]=useState(()=>localStorage.getItem("gst_provider")||"groq");
  const [apiKey,setApiKey]=useState(()=>localStorage.getItem("gst_api_key")||"");
  const handleSetProvider=p=>{setProvider(p);if(apiKey){setApiKey("");localStorage.removeItem("gst_api_key");}};
  return (
    <div className="app">
      <div className="wrap">
        <div className="hdr">
          <div className="hdr-badge">🇮🇳 India · GST Portal</div>
          <div className="logo"><div className="logo-text">GST</div><div className="logo-sub">₹</div></div>
          <h1>GST <em>Calculator</em> Pro</h1>
          <p>Photo lookup · Full breakdown · Invoice generator · 100% Free</p>
        </div>
        <ApiSetup provider={provider} setProvider={handleSetProvider} apiKey={apiKey} setApiKey={setApiKey}/>
        <div className="tabs">
          {[["lookup","🔍 Lookup"],["calc","🧮 Calculator"],["history","🕐 History"],["faq","❓ FAQ"],["feedback","💬 Feedback"]].map(([k,v])=>(
            <button key={k} className={`tab${tab===k?" on":""}`} onClick={()=>setTab(k)}>{v}</button>
          ))}
        </div>
        {tab==="lookup"&&<LookupTab onUseCalc={r=>{setCalcRate(r);setTab("calc");}} history={history} setHistory={setHistory} provider={provider} apiKey={apiKey}/>}
        {tab==="calc"&&<CalcTab initRate={calcRate}/>}
        {tab==="history"&&<HistoryTab history={history} onClear={()=>setHistory([])}/>}
        {tab==="faq"&&<FaqTab/>}
        {tab==="feedback"&&<FeedbackTab/>}
        <div className="footer-note">© 2025 GST Calculator Pro · India · For reference only · Verify with a CA</div>
      </div>
    </div>
  );
}
ReactDOM.render(<App/>, document.getElementById("root"));
</script>
</body>
</html>
