  --bg:#f5f2ec;--surface:#fff;--surface2:#f0ece4;--border:#e2ddd6;
  --text:#1a1714;--text2:#6b6560;--text3:#a8a29e;

  --blue:#1d4ed8;--blue-light:#eff6ff;

body{background:var(--bg);font-family:'Outfit',sans-serif;color:var(--text);}
.app{min-height:100vh;padding:24px 14px 60px;}
.wrap{max-width:820px;margin:0 auto;}
.hdr{text-align:center;margin-bottom:24px;}
.hdr-badge{display:inline-flex;align-items:center;gap:6px;background:var(--gold-light);border:1px solid var(--gold-border);color:var(--gold);font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;padding:5px 14px;border-radius:100px;margin-bottom:12px;}
.hdr h1{font-size:clamp(28px,5vw,50px);line-height:1;margin-bottom:6px;font-weight:700;}
.hdr h1 em{color:var(--gold);font-style:normal;}
.hdr p{color:var(--text2);font-size:13px;}

.api-card{background:var(--surface);border:1.5px solid var(--gold-border);border-radius:16px;padding:20px;margin-bottom:16px;}
.api-card-title{font-size:14px;font-weight:700;color:var(--gold);margin-bottom:4px;}

.provider-btn:hover{border-color:var(--gold);color:var(--gold);}

.results-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.res-tile{background:var(--surface2);border-radius:11px;padding:13px;text-align:center;}
.res-tile .lbl{font-size:9px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--text3);margin-bottom:4px;}
.res-tile .val{font-size:18px;font-weight:700;}
.res-tile.hi .val{color:var(--gold);}
.res-tile.gr .val{color:var(--green);}
.igst-row{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:9px;}
.igst-tile{background:var(--surface2);border-radius:9px;padding:9px;text-align:center;}
.igst-tile .lbl{font-size:9px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--text3);margin-bottom:3px;}
.igst-tile .val{font-size:13px;font-weight:600;color:var(--text2);}
.inv{background:#fff;border:1px solid var(--border);border-radius:12px;padding:18px;margin-top:11px;}
.inv-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;padding-bottom:11px;border-bottom:2px solid var(--text);}
.inv-title{font-size:22px;font-weight:700;}
.inv-table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:11px;}
.inv-table th{text-align:left;padding:6px 8px;background:var(--surface2);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--text2);}
.inv-table td{padding:8px;border-bottom:1px solid var(--border);}
.inv-table .tr td{font-weight:700;padding-top:10px;border-bottom:none;}
.inv-footer{font-size:10px;color:var(--text3);text-align:center;padding-top:10px;border-top:1px solid var(--border);}
.hist-item{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid var(--border);}
.hist-item:last-child{border-bottom:none;}
.hist-badge{background:var(--gold-light);color:var(--gold);font-weight:700;font-size:12px;border-radius:8px;padding:5px 9px;min-width:46px;text-align:center;border:1px solid var(--gold-border);}
.hist-badge.ex{background:var(--surface2);color:var(--text2);border-color:var(--border);}
.hist-name{font-weight:600;font-size:14px;}
.hist-meta{font-size:11px;color:var(--text3);margin-top:1px;}
.loading{display:flex;align-items:center;gap:9px;padding:13px 0;color:var(--text2);font-size:13px;}
.ld{width:6px;height:6px;background:var(--gold);border-radius:50%;animation:ld 1.2s infinite;}
.ld:nth-child(2){animation-delay:.2s;}.ld:nth-child(3){animation-delay:.4s;}
@keyframes ld{0%,80%,100%{transform:scale(.5);opacity:.4}40%{transform:scale(1);opacity:1}}
.err{background:var(--red-light);border:1px solid #fca5a5;border-radius:9px;padding:10px 13px;color:var(--red);font-size:13px;margin-top:10px;}
.stars-row{display:flex;gap:10px;margin-bottom:16px;align-items:center;}
.star{font-size:30px;cursor:pointer;transition:transform .15s;opacity:.25;filter:grayscale(1);}
.star.lit{opacity:1;filter:none;transform:scale(1.12);}
.fb-cats{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px;}
.fb-cat{padding:6px 13px;border-radius:100px;border:1.5px solid var(--border);background:transparent;font-family:'Outfit',sans-serif;font-size:12px;cursor:pointer;color:var(--text2);transition:all .15s;}
.fb-cat.on{background:var(--gold-light);border-color:var(--gold-border);color:var(--gold);font-weight:600;}
.ok-box{background:var(--green-light);border:1px solid #a7d9be;border-radius:12px;padding:24px;text-align:center;}
.rating-summary{display:grid;grid-template-columns:85px 1fr;gap:14px;align-items:center;background:var(--surface2);border-radius:12px;padding:14px;margin-bottom:14px;}
.rating-big{font-size:44px;font-weight:800;color:var(--gold);line-height:1;text-align:center;}
.rating-sub{font-size:11px;color:var(--text3);text-align:center;margin-top:2px;}
.bar-row{display:flex;align-items:center;gap:7px;margin-bottom:5px;}
.bar-lbl{font-size:12px;color:var(--text2);width:12px;text-align:right;}
.bar-track{flex:1;height:6px;background:var(--border);border-radius:100px;overflow:hidden;}
.bar-fill{height:100%;background:var(--gold);border-radius:100px;}
.bar-cnt{font-size:11px;color:var(--text3);width:18px;}
.fb-card{background:var(--surface2);border-radius:11px;padding:13px;border:1px solid var(--border);margin-bottom:9px;}
.fb-card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;}
.fb-card-stars{font-size:13px;}
.fb-card-meta{font-size:11px;color:var(--text3);}
.fb-card-cat{display:inline-block;background:var(--gold-light);color:var(--gold);font-size:10px;font-weight:600;padding:2px 8px;border-radius:100px;margin-bottom:5px;}
.fb-card-msg{font-size:13px;color:var(--text2);line-height:1.6;}
.footer-note{text-align:center;color:var(--text3);font-size:11px;margin-top:8px;}
.free-badge{background:var(--green-light);color:var(--green);font-size:10px;font-weight:700;padding:2px 7px;border-radius:100px;border:1px solid #a7d9be;margin-left:5px;}
@media(max-width:480px){.calc-2col{grid-template-columns:1fr;}.provider-grid{grid-template-columns:1fr 1fr;}}
</style>

<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;
const SLABS = [0,5,12,18,28];
const fmt = n => Number(n).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
const INIT_FBS = [
  {name:"Rahul M.",rating:5,category:"Accuracy",msg:"Uploaded a Maggi packet and got the exact 18% rate instantly!",time:"2 days ago"},
  {name:"Priya S.",rating:4,category:"UI / Design",msg:"Clean and easy to use. Invoice generator is super helpful.",time:"5 days ago"},
  {name:"Ankit T.",rating:5,category:"Calculator",msg:"The CGST + SGST split saves me so much time every day.",time:"1 week ago"},
];

const PROVIDERS = [
  { id:"gemini", name:"Provider 1", tag:"FREE Forever", free:true, placeholder:"AIzaSy-xxxxxxxxxxxx", link:"https://aistudio.google.com/app/apikey", linkText:"Get free key at aistudio.google.com" },
  { id:"groq",   name:"Provider 2", tag:"FREE Tier",    free:true, placeholder:"gsk_xxxxxxxxxxxx",    link:"https://console.groq.com",              linkText:"Get free key at console.groq.com" },
  { id:"openrouter", name:"Provider 3", tag:"FREE Models", free:true, placeholder:"sk-or-xxxxxxxxxxxx", link:"https://openrouter.ai/keys",            linkText:"Get free key at openrouter.ai" },
  { id:"claude", name:"Provider 4",      tag:"Paid",        free:false, placeholder:"sk-ant-xxxxxxxxxxxx", link:"https://console.anthropic.com",        linkText:"Get key at console.anthropic.com" },
];

async function callGemini(prompt, imageBase64, apiKey) {
  const parts = [];
  if(imageBase64) parts.push({inlineData:{mimeType:"image/jpeg",data:imageBase64}});
  parts.push({text: prompt});
  const res = await fetch(`https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash-latest:generateContent?key=${apiKey}`, {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({contents:[{parts}]})
  });
  const data = await res.json();
  if(data.error) throw new Error(data.error.message);
  return data.candidates[0].content.parts[0].text;
}

async function callGroq(prompt, apiKey) {
  const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
    method:"POST",
    headers:{"Content-Type":"application/json","Authorization":`Bearer ${apiKey}`},
    body:JSON.stringify({model:"llama-3.3-70b-versatile",messages:[{role:"user",content:prompt}],max_tokens:1000})
  });
  const data = await res.json();
  if(data.error) throw new Error(data.error.message);
  return data.choices[0].message.content;
}

async function callOpenRouter(prompt, apiKey) {
  const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
    method:"POST",
    headers:{"Content-Type":"application/json","Authorization":`Bearer ${apiKey}`},
    body:JSON.stringify({model:"mistralai/mistral-7b-instruct:free",messages:[{role:"user",content:prompt}],max_tokens:1000})
  });
  const data = await res.json();
  if(data.error) throw new Error(data.error.message||JSON.stringify(data.error));
  return data.choices[0].message.content;
}

async function callClaude(prompt, imageBase64, apiKey) {
  const userContent = imageBase64
    ? [{type:"image",source:{type:"base64",media_type:"image/jpeg",data:imageBase64}},{type:"text",text:prompt}]
    : prompt;
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST",
    headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,messages:[{role:"user",content:userContent}]})
  });
  const data = await res.json();
  if(data.error) throw new Error(data.error.message);
  return data.content.map(i=>i.text||"").join("");
}

async function queryAI(prompt, imageBase64, provider, apiKey) {
  if(provider==="gemini") return callGemini(prompt, imageBase64, apiKey);
  if(provider==="groq")   return callGroq(prompt, apiKey);
  if(provider==="openrouter") return callOpenRouter(prompt, apiKey);
  if(provider==="claude") return callClaude(prompt, imageBase64, apiKey);
  throw new Error("No provider selected");
}

// ── API SETUP ─────────────────────────────────────────────────────────────────
function ApiSetup({provider, setProvider, apiKey, setApiKey}) {
  const [input, setInput] = useState("");
  const [show, setShow] = useState(false);
  const p = PROVIDERS.find(x=>x.id===provider) || PROVIDERS[0];

  const save = () => {
    if(!input.trim()) return;
    setApiKey(input.trim());
    localStorage.setItem("gst_api_key", input.trim());
    localStorage.setItem("gst_provider", provider);
  };
  const clear = () => { setApiKey(""); setInput(""); localStorage.removeItem("gst_api_key"); };

  if(apiKey) return (
    <div className="api-saved">
      <div className="api-saved-text">✅ Connected — GST lookup active!</div>
    </div>
  );

  return (
    <div className="api-card">
      <div className="api-card-title">🔑 Connect API Key to enable GST Lookup</div>
      <div className="api-card-sub">Choose a provider below — all have free options! Get your key and paste it here. Your key is saved only on your device.</div>

      <div className="provider-grid">
        {PROVIDERS.map(pr=>(
          <button key={pr.id} className={`provider-btn${provider===pr.id?" on":""}`} onClick={()=>setProvider(pr.id)}>
            <span className="provider-name">{pr.name}</span>
            <span className={`provider-tag${pr.free?"":" paid"}`}>{pr.tag}</span>
          </button>
        ))}
      </div>

      <a className="api-link" href={p.link} target="_blank">👉 {p.linkText}</a>

      <div className="api-row">
        <input className="api-inp" type={show?"text":"password"} placeholder={p.placeholder} value={input} onChange={e=>setInput(e.target.value)}/>
        <button className="btn btn-sm btn-outline" onClick={()=>setShow(s=>!s)}>{show?"Hide":"Show"}</button>
        <button className="btn btn-sm btn-green" onClick={save}>Save</button>
      </div>
      <div style={{fontSize:11,color:"var(--text3)"}}>🔒 Key saved only on your device — never shared with anyone</div>
    </div>
  );
}

// ── LOOKUP ────────────────────────────────────────────────────────────────────
function LookupTab({onUseCalc, history, setHistory, provider, apiKey}) {
  const [query,setQuery]=useState("");
  const [img64,setImg64]=useState(null);
  const [imgSrc,setImgSrc]=useState(null);
  const [loading,setLoading]=useState(false);
  const [info,setInfo]=useState(null);
  const [err,setErr]=useState("");

  const loadFile = file => {
    if(!file) return;
    const reader = new FileReader();
    reader.onload = e => {setImgSrc(e.target.result);setImg64(e.target.result.split(",")[1]);setInfo(null);setErr("");};
    reader.readAsDataURL(file);
  };

  const checkGST = async () => {
    if(!apiKey){setErr("Please connect your API key first (see the box above).");return;}
    if(!query.trim()&&!img64) return;
    setLoading(true);setErr("");setInfo(null);
    const prompt = `You are an Indian GST expert. ${img64&&provider==="gemini"?"Identify the product in the image and then provide":`For the product "${query}", provide`} detailed GST information under Indian GST law 2024-25.
Respond ONLY with valid JSON, no markdown, no backticks, no explanation:
{"applicable":true,"rate":18,"detectedName":"product name","category":"category name","hsn":"HSN code","type":"Goods or Services","note":"Write 3 to 4 lines explaining: 1) Why this GST rate applies 2) Which GST council notification covers this 3) Any special conditions or exemptions 4) If rate was recently changed mention that too","exemptionReason":"If exempt explain why in 2 lines else empty string","alternateRates":"If product has different rates for different variants explain clearly else empty string"}
Important rules: applicable must be true even for 0% zero-rated items. false only if completely exempt from GST. rate must be exactly one of: 0, 5, 12, 18, or 28. Give accurate HSN code.`;
    try {
      const text = await queryAI(prompt, (provider==="gemini"?img64:null), provider, apiKey);
      const clean = text.replace(/```json|```/g,"").trim();
      const parsed = JSON.parse(clean);
      const result = {...parsed, product: img64&&provider==="gemini"?(parsed.detectedName||"Identified Product"):query};
      setInfo(result);
      setHistory(h=>[result,...h.filter(x=>x.product!==result.product)].slice(0,12));
    } catch(e){setErr("Error: "+e.message+". Please check your API key.");}
    setLoading(false);
  };

  const clearImg=()=>{setImg64(null);setImgSrc(null);setInfo(null);};
  const isYes=info&&info.applicable&&info.rate>0;
  const cls=isYes?"yes":"no";

  return (
    <div className="card">
      <div className="card-title">📦 Search by Name or Photo</div>
      {imgSrc?(
        <div className="preview-wrap">
          <img src={imgSrc} alt="product" className="preview-img"/>
          <button className="preview-rm" onClick={clearImg}>✕ Remove</button>
        </div>
      ):(
        <>
          <div className="photo-options">
            <div className="photo-btn">
              <span className="ico">📷</span><span>Open Camera</span>
              <input type="file" accept="image/*" capture="environment" onChange={e=>loadFile(e.target.files[0])}/>
            </div>
            <div className="photo-btn">
              <span className="ico">🖼️</span><span>Choose Photo</span>
              <input type="file" accept="image/*" onChange={e=>loadFile(e.target.files[0])}/>
            </div>
          </div>
          <div style={{textAlign:"center",color:"var(--text3)",fontSize:12,marginBottom:10}}>📸 Tip: Photograph the product label for best results</div>
        </>
      )}
      <div style={{textAlign:"center",color:"var(--text3)",fontSize:12,marginBottom:10}}>— or type the product name —</div>
      <div className="row">
        <input className="inp" placeholder="e.g. Mobile phone, Rice, Gold jewellery..." value={query} onChange={e=>setQuery(e.target.value)} onKeyDown={e=>e.key==="Enter"&&checkGST()}/>
        <button className="btn btn-gold" onClick={checkGST} disabled={loading||(!query.trim()&&!img64)}>{loading?"...":"Check GST"}</button>
      </div>
      {loading&&<div className="loading"><div className="ld"/><div className="ld"/><div className="ld"/><span>Checking GST rates...</span></div>}
      {err&&<div className="err">⚠️ {err}</div>}
      {info&&!loading&&(
        <div className={`result ${cls}`}>
          <div className="r-top">
            <div className="r-product">{info.product}</div>
            <span className={`r-status ${cls}`}>{isYes?"GST Applicable":info.rate===0&&info.applicable?"Zero Rated":"Exempt"}</span>
          </div>
          {isYes&&<><div className="rate-big">{info.rate}%</div><div style={{fontSize:13,color:"var(--text2)"}}>{info.category}</div></>}
          <div className="info-grid">
            {info.hsn&&<div className="info-item"><div className="info-lbl">HSN/SAC Code</div><div className="info-val">{info.hsn}</div></div>}
            {info.category&&<div className="info-item"><div className="info-lbl">Category</div><div className="info-val">{info.category}</div></div>}
            {info.type&&<div className="info-item"><div className="info-lbl">Supply Type</div><div className="info-val">{info.type}</div></div>}
            {isYes&&<div className="info-item"><div className="info-lbl">CGST Rate</div><div className="info-val">{info.rate/2}%</div></div>}
            {isYes&&<div className="info-item"><div className="info-lbl">SGST Rate</div><div className="info-val">{info.rate/2}%</div></div>}
            {isYes&&<div className="info-item"><div className="info-lbl">IGST Rate</div><div className="info-val">{info.rate}%</div></div>}
          </div>
          {isYes&&<div className="breakdown">
            <div className="bk-row"><span className="bk-hd">Intra-State</span><span/></div>
            <div className="bk-row"><span>CGST</span><span style={{fontWeight:600}}>{info.rate/2}%</span></div>
            <div className="bk-row"><span>SGST/UTGST</span><span style={{fontWeight:600}}>{info.rate/2}%</span></div>
            <div className="bk-row" style={{marginTop:6}}><span className="bk-hd">Inter-State</span><span/></div>
            <div className="bk-row"><span>IGST</span><span style={{fontWeight:600}}>{info.rate}%</span></div>
          </div>}
          {info.note&&<div className="note-box">📋 {info.note}</div>}
          {info.exemptionReason&&<div className="note-box" style={{marginTop:8}}>ℹ️ {info.exemptionReason}</div>}
          {info.alternateRates&&<div className="note-box" style={{background:"var(--gold-light)",border:"1px solid var(--gold-border)",color:"var(--gold)",marginTop:8}}>⚡ {info.alternateRates}</div>}
          {isYes&&<button className="btn btn-gold btn-sm" style={{marginTop:12}} onClick={()=>onUseCalc(info.rate)}>Use {info.rate}% in Calculator →</button>}
        </div>
      )}
    </div>
  );
}

// ── CALCULATOR ────────────────────────────────────────────────────────────────
function CalcTab({initRate}) {
  const [amount,setAmount]=useState("");const [rate,setRate]=useState(initRate||18);
  const [mode,setMode]=useState("excl");const [txn,setTxn]=useState("intra");
  const [showInv,setShowInv]=useState(false);const [invDesc,setInvDesc]=useState("");
  const n=parseFloat(amount)||0,r=parseFloat(rate)||0;
  let base,gstAmt,total;
  if(mode==="excl"){base=n;gstAmt=n*r/100;total=n+gstAmt;}
  else{total=n;base=n*100/(100+r);gstAmt=total-base;}
  const half=gstAmt/2;
  const invNo="GST-"+Date.now().toString().slice(-6);
  const today=new Date().toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"});
  return (
    <div className="card">
      <div className="card-title">🧮 GST Calculator</div>
      <div className="ctog">
        <button className={`ctog-btn${mode==="excl"?" on":""}`} onClick={()=>setMode("excl")}>➕ Add GST to amount</button>
        <button className={`ctog-btn${mode==="incl"?" on":""}`} onClick={()=>setMode("incl")}>➖ Extract GST from amount</button>
      </div>
      <div className="calc-2col">
        <div><div className="field-lbl">{mode==="excl"?"Base Amount (₹)":"Total incl. GST (₹)"}</div>
          <input className="inp" type="number" placeholder="0.00" value={amount} onChange={e=>setAmount(e.target.value)}/></div>
        <div><div className="field-lbl">GST Rate (%)</div>
          <input className="inp" type="number" value={rate} onChange={e=>setRate(e.target.value)}/></div>
      </div>
      <div className="field-lbl">Quick slab</div>
      <div className="slabs">{SLABS.map(s=><button key={s} className={`slab${parseFloat(rate)===s?" on":""}`} onClick={()=>setRate(s)}>{s}%</button>)}</div>
      <div className="field-lbl">Transaction type</div>
      <div className="ctog" style={{marginBottom:14}}>
        <button className={`ctog-btn${txn==="intra"?" on":""}`} onClick={()=>setTxn("intra")}>🏙️ Intra-State</button>
        <button className={`ctog-btn${txn==="inter"?" on":""}`} onClick={()=>setTxn("inter")}>🌐 Inter-State</button>
      </div>
      {n>0&&<>
        <div className="results-row">
          <div className="res-tile"><div className="lbl">Base Amount</div><div className="val">₹{fmt(base)}</div></div>
          <div className="res-tile hi"><div className="lbl">GST ({r}%)</div><div className="val">₹{fmt(gstAmt)}</div></div>
          <div className="res-tile gr"><div className="lbl">Total</div><div className="val">₹{fmt(total)}</div></div>
        </div>
        <div className="igst-row">
          {txn==="intra"?<>
            <div className="igst-tile"><div className="lbl">CGST ({r/2}%)</div><div className="val">₹{fmt(half)}</div></div>
            <div className="igst-tile"><div className="lbl">SGST ({r/2}%)</div><div className="val">₹{fmt(half)}</div></div>
            <div className="igst-tile"><div className="lbl">IGST</div><div className="val" style={{color:"var(--text3)"}}>N/A</div></div>
          </>:<>
            <div className="igst-tile"><div className="lbl">CGST</div><div className="val" style={{color:"var(--text3)"}}>N/A</div></div>
            <div className="igst-tile"><div className="lbl">SGST</div><div className="val" style={{color:"var(--text3)"}}>N/A</div></div>
            <div className="igst-tile"><div className="lbl">IGST ({r}%)</div><div className="val">₹{fmt(gstAmt)}</div></div>
          </>}
        </div>
        <div style={{marginTop:14,borderTop:"1px solid var(--border)",paddingTop:13}}>
          <div className="field-lbl">Item description (for invoice)</div>
          <div className="row" style={{marginBottom:9}}>
            <input className="inp" placeholder="e.g. Samsung Galaxy S24" value={invDesc} onChange={e=>setInvDesc(e.target.value)}/>
            <button className="btn btn-sm" onClick={()=>setShowInv(v=>!v)}>{showInv?"Hide":"📄 Invoice"}</button>
          </div>
          {showInv&&<div className="inv">
            <div className="inv-head">
              <div><div className="inv-title">TAX INVOICE</div><div style={{fontSize:11,color:"var(--text2)"}}>#{invNo} · {today}</div></div>
              <div style={{fontSize:11,color:"var(--text2)",textAlign:"right"}}>GST {r}% · {txn==="intra"?"Intra-State":"Inter-State"}</div>
            </div>
            <table className="inv-table">
              <thead><tr><th>#</th><th>Description</th><th style={{textAlign:"right"}}>Taxable</th><th style={{textAlign:"right"}}>GST</th><th style={{textAlign:"right"}}>Total</th></tr></thead>
              <tbody><tr><td>1</td><td>{invDesc||"Product / Service"}</td><td style={{textAlign:"right"}}>₹{fmt(base)}</td><td style={{textAlign:"right"}}>₹{fmt(gstAmt)}</td><td style={{textAlign:"right"}}>₹{fmt(total)}</td></tr></tbody>
              <tfoot>
                {txn==="intra"?<>
                  <tr><td colSpan="3"/><td style={{fontSize:11,color:"var(--text2)"}}>CGST@{r/2}%</td><td style={{textAlign:"right",fontSize:11}}>₹{fmt(half)}</td></tr>
                  <tr><td colSpan="3"/><td style={{fontSize:11,color:"var(--text2)"}}>SGST@{r/2}%</td><td style={{textAlign:"right",fontSize:11}}>₹{fmt(half)}</td></tr>
                </>:<tr><td colSpan="3"/><td style={{fontSize:11,color:"var(--text2)"}}>IGST@{r}%</td><td style={{textAlign:"right",fontSize:11}}>₹{fmt(gstAmt)}</td></tr>}
                <tr className="tr"><td colSpan="3"/><td style={{fontWeight:700}}>Grand Total</td><td style={{textAlign:"right",fontWeight:700,color:"var(--green)"}}>₹{fmt(total)}</td></tr>
              </tfoot>
            </table>
            <div className="inv-footer">For reference only · Verify with a CA before filing</div>
          </div>}
        </div>
      </>}
    </div>
  );
}

// ── HISTORY ───────────────────────────────────────────────────────────────────
function HistoryTab({history,onClear}) {
  if(!history.length) return (
    <div className="card"><div className="card-title">🕐 Recent Lookups</div>
      <div style={{textAlign:"center",padding:"36px 0",color:"var(--text3)"}}>
        <div style={{fontSize:28,marginBottom:8}}>🔍</div>
        <div style={{fontSize:14}}>No lookups yet. Search a product first!</div>
      </div>
    </div>
  );
  return (
    <div className="card"><div className="card-title">🕐 Recent Lookups ({history.length})</div>
      {history.map((h,i)=>(
        <div key={i} className="hist-item">
          <div className={`hist-badge${!h.applicable?" ex":""}`}>{h.applicable?`${h.rate}%`:"Exempt"}</div>
          <div style={{flex:1}}><div className="hist-name">{h.product}</div><div className="hist-meta">{h.category}{h.hsn?` · HSN: ${h.hsn}`:""}</div></div>
        </div>
      ))}
      <button className="btn btn-outline btn-sm" style={{marginTop:13}} onClick={onClear}>Clear History</button>
    </div>
  );
}

// ── FEEDBACK ──────────────────────────────────────────────────────────────────
function FeedbackTab() {
  const [feedbacks,setFeedbacks]=useState(INIT_FBS);
  const [rating,setRating]=useState(0);const [hover,setHover]=useState(0);
  const [category,setCategory]=useState("");const [name,setName]=useState("");
  const [msg,setMsg]=useState("");const [submitted,setSubmitted]=useState(false);
  const avg=feedbacks.length?(feedbacks.reduce((s,f)=>s+f.rating,0)/feedbacks.length).toFixed(1):"—";
  const starCounts=[5,4,3,2,1].map(s=>({s,count:feedbacks.filter(f=>f.rating===s).length}));
  const submit=()=>{
    if(!rating) return;
    setFeedbacks(prev=>[{name:name.trim()||"Anonymous",rating,category:category||"General",msg:msg.trim()||"No message.",time:"Just now"},...prev]);
    setSubmitted(true);
  };
  const reset=()=>{setRating(0);setHover(0);setCategory("");setName("");setMsg("");setSubmitted(false);};
  return (
    <>
      <div className="card"><div className="card-title">📊 Overall Rating</div>
        <div className="rating-summary">
          <div><div className="rating-big">{avg}</div><div className="rating-sub">/ 5 · {feedbacks.length} reviews</div></div>
          <div style={{flex:1}}>
            {starCounts.map(({s,count})=>(
              <div className="bar-row" key={s}>
                <span className="bar-lbl">{s}</span>
                <div className="bar-track"><div className="bar-fill" style={{width:feedbacks.length?`${count/feedbacks.length*100}%`:"0%"}}/></div>
                <span className="bar-cnt">{count}</span>
              </div>
            ))}
          </div>
        </div>
      </div>
      <div className="card"><div className="card-title">✍️ Leave Your Feedback</div>
        {submitted?(
          <div className="ok-box">
            <div style={{fontSize:32,marginBottom:8}}>🎉</div>
            <div style={{fontWeight:700,color:"var(--green)",fontSize:16}}>Thank you!</div>
            <div style={{fontSize:13,color:"var(--text2)",marginTop:4}}>Your review helps us improve.</div>
            <button className="btn btn-outline btn-sm" style={{marginTop:13}} onClick={reset}>Write Another</button>
          </div>
        ):(
          <>
            <div className="field-lbl">Your Rating *</div>
            <div className="stars-row">
              {[1,2,3,4,5].map(s=>(
                <span key={s} className={`star${(hover||rating)>=s?" lit":""}`}
                  onMouseEnter={()=>setHover(s)} onMouseLeave={()=>setHover(0)} onClick={()=>setRating(s)}>⭐</span>
              ))}
              {rating>0&&<span style={{fontSize:13,color:"var(--text2)",marginLeft:4}}>{["","Poor","Fair","Good","Great","Excellent!"][rating]}</span>}
            </div>
            <div className="field-lbl">Category</div>
            <div className="fb-cats">
              {["Accuracy","Calculator","UI / Design","Photo Feature","Speed","Suggestions"].map(c=>(
                <button key={c} className={`fb-cat${category===c?" on":""}`} onClick={()=>setCategory(c)}>{c}</button>
              ))}
            </div>
            <div className="field-lbl">Your Name (optional)</div>
            <input className="inp" placeholder="e.g. Rahul M." value={name} onChange={e=>setName(e.target.value)} style={{marginBottom:12}}/>
            <div className="field-lbl">Your Message (optional)</div>
            <textarea className="textarea" placeholder="What works well? What can be improved?" value={msg} onChange={e=>setMsg(e.target.value)} style={{marginBottom:14}}/>
            <button className="btn btn-gold" onClick={submit} disabled={!rating}>Submit Feedback ✓</button>
            {!rating&&<div style={{fontSize:12,color:"var(--text3)",marginTop:7}}>Please select a star rating first.</div>}
          </>
        )}
      </div>
      <div className="card"><div className="card-title">💬 All Reviews ({feedbacks.length})</div>
        {feedbacks.map((f,i)=>(
          <div key={i} className="fb-card">
            <div className="fb-card-top"><span className="fb-card-stars">{"⭐".repeat(f.rating)}</span><span className="fb-card-meta">{f.name} · {f.time}</span></div>
            <div className="fb-card-cat">{f.category}</div>
            <div className="fb-card-msg">{f.msg}</div>
          </div>
        ))}
      </div>
    </>
  );
}

// ── MAIN APP ──────────────────────────────────────────────────────────────────
function App() {
  const [tab,setTab]=useState("lookup");
  const [calcRate,setCalcRate]=useState(18);
  const [history,setHistory]=useState([]);
  const [provider,setProvider]=useState(()=>localStorage.getItem("gst_provider")||"gemini");
  const [apiKey,setApiKey]=useState(()=>localStorage.getItem("gst_api_key")||"");

  const handleSetProvider = p => {
    setProvider(p);
    if(apiKey) { setApiKey(""); localStorage.removeItem("gst_api_key"); }
  };

  return (
    <div className="app">
      <div className="wrap">
        <div className="hdr">
          <div className="hdr-badge">🇮🇳 India · GST Portal</div>
          <h1>GST <em>Calculator</em> Pro</h1>
          <p>Photo lookup · Full breakdown · Invoice generator · 100% Free</p>
        </div>

        <ApiSetup provider={provider} setProvider={handleSetProvider} apiKey={apiKey} setApiKey={setApiKey}/>

        <div className="tabs">
          {[["lookup","🔍 Lookup"],["calc","🧮 Calculator"],["history","🕐 History"],["feedback","💬 Feedback"]].map(([k,v])=>(
            <button key={k} className={`tab${tab===k?" on":""}`} onClick={()=>setTab(k)}>{v}</button>
          ))}
        </div>
        {tab==="lookup"&&<LookupTab onUseCalc={r=>{setCalcRate(r);setTab("calc");}} history={history} setHistory={setHistory} provider={provider} apiKey={apiKey}/>}
        {tab==="calc"&&<CalcTab initRate={calcRate}/>}
        {tab==="history"&&<HistoryTab history={history} onClear={()=>setHistory([])}/>}
        {tab==="feedback"&&<FeedbackTab/>}
        <div className="footer-note">© 2025 GST Calculator Pro · India · For reference only · Verify with a CA</div>
      </div>
    </div>
  );
}
ReactDOM.render(<App/>, document.getElementById("root"));
</script>
</body>
</html>
